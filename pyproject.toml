[project]
name = "benchhud-intake"
dynamic = ["version"]
description = "Self-hosted repair intake — a tablet-friendly form plus a REST API benchhud consumes as a TicketSource."
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Small-Business-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Cupp" }]
keywords = ["repair", "intake", "board-repair", "bench", "self-hosted"]

# Belt and braces: this package holds the schema for customer PII and is not
# open source. The classifier makes PyPI refuse an upload outright.
classifiers = ["Private :: Do Not Upload"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
# The menu-bar / tray app. Essentials is QtCore, QtGui and QtWidgets only; the
# server (container, cluster, `serve`) never needs Qt.
tray = ["pyside6-essentials>=6.8"]

[project.scripts]
benchhud-intake = "intake.cli:main"

[project.urls]
Homepage = "https://github.com/IamMrCupp/benchhud-intake"
Issues = "https://github.com/IamMrCupp/benchhud-intake/issues"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "httpx2>=2.7.0",
    "pyside6-essentials>=6.8",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/intake/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/intake"]

# Kept deliberately identical to benchhud's config (minus its Qt bits) so the
# two repos lint the same way and muscle memory transfers between them.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# The menu-bar / tray app (#85), packaged with Briefcase like benchhud. Name,
# version and dependencies come from [project]; this adds what a bundle needs.
[tool.briefcase]
project_name = "benchhud-intake"
bundle = "com.iammrcupp.benchhud"

[tool.briefcase.app.intake]
formal_name = "benchhud intake"
description = "Repair intake for the bench: a menu-bar app that runs the intake server."
long_description = """benchhud intake takes in repair jobs at the counter: customer, device,
symptoms and condition photos, on a tablet-friendly web form. benchhud pulls
its work queue from it. This app runs it from the menu bar (macOS) or system
tray (Windows): start, stop, share on the LAN, set the password."""
sources = ["src/intake"]
requires = ["pyside6-essentials>=6.8"]
icon = "packaging/icons/intake"

[tool.briefcase.app.intake.macOS]
# PySide6 6.8+ only ships macosx_13_0 wheels (as in benchhud); one arch per build.
universal_build = false
min_os_version = "13.0"
requires = ["std-nslog~=1.0.3"]
# A menu-bar app: no Dock icon, no main window.
info."LSUIElement" = true
