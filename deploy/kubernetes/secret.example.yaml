# TEMPLATE ONLY: never commit real values. Copy it, fill it in, apply it, delete it:
#
#   cp secret.example.yaml /tmp/intake-secret.yaml && $EDITOR /tmp/intake-secret.yaml
#   kubectl -n <namespace> apply -f /tmp/intake-secret.yaml && rm /tmp/intake-secret.yaml
#
# The password hash: run `benchhud-intake set-password` anywhere and copy the
# INTAKE_PASSWORD_HASH line from its settings.env (`benchhud-intake paths`), or
# `uv run python -m intake.auth` in a checkout.
apiVersion: v1
kind: Secret
metadata:
  name: benchhud-intake-secrets
type: Opaque
stringData:
  # Required. The app won't start without it.
  INTAKE_PASSWORD_HASH: "scrypt$16384$8$1$CHANGE-ME"
  # Signs the session cookie. If unset it's derived from the password hash,
  # which works, but then changing the password logs everyone out.
  INTAKE_SESSION_SECRET: "CHANGE-ME"
  # Optional: the bearer token benchhud's Tickets tab uses. `benchhud-intake new-token`.
  INTAKE_API_TOKEN: "CHANGE-ME"
