name: Image

# Docs-only changes don't affect the image. Without these filters a README edit
# costs several minutes of QEMU emulation to rebuild both architectures.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".github/pull_request_template.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # QEMU emulates arm64 on the amd64 runner. Without it, buildx can only
      # produce the runner's own architecture and the Pi cluster gets nothing.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # PRs build both architectures but never push — arch breakage is caught
      # before merge, without publishing an image for an unreviewed branch.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/iammrcupp/benchhud-intake:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The deploy target is a Raspberry Pi cluster. If linux/arm64 ever falls
      # out of the platforms list above, this fails the build here rather than
      # letting a pod fail to schedule on the cluster days later.
      - name: Assert published manifest includes linux/arm64
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect ghcr.io/iammrcupp/benchhud-intake:latest)
          echo "$manifest"
          if ! grep -q 'linux/arm64' <<<"$manifest"; then
            echo "::error::published manifest does not advertise linux/arm64"
            exit 1
          fi
          echo "✓ linux/arm64 present in published manifest"
