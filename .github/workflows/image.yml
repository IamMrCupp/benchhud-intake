name: Image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # QEMU emulates arm64 on the amd64 runner. Without it, buildx can only
      # produce the runner's own architecture and the Pi cluster gets nothing.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # PRs build both architectures but never push — arch breakage is caught
      # before merge, without publishing an image for an unreviewed branch.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/iammrcupp/benchhud-intake:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
