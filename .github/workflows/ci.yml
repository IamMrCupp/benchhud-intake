name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A release builds its installers with exactly these jobs and checks, at the
  # release tag (release-assets.yml). Empty ref = the event's own commit.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # The workflow name keeps a release build (called from release-please) and the
  # normal build of the same push to main from cancelling each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      # The tray tests build a real Qt menu; there's no display in CI.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      # --frozen: uv.lock is authoritative. A lockfile out of sync with
      # pyproject.toml fails here rather than silently resolving something else.
      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  # The Kubernetes base must keep rendering, and keep the two settings that
  # protect the SQLite store.
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Render deploy/kubernetes
        run: |
          set -euo pipefail
          kubectl kustomize deploy/kubernetes > rendered.yaml
          cat rendered.yaml
          grep -q "replicas: 1" rendered.yaml || { echo "::error::replicas must be 1"; exit 1; }
          grep -q "type: Recreate" rendered.yaml || { echo "::error::strategy must be Recreate"; exit 1; }

  # The menu-bar app (#85): build it on macOS and prove the packaged app serves.
  # INTAKE_TRAY_SMOKE builds the real menu, starts the server, fetches /healthz
  # and exits 0; anything else is a failure. No display is needed.
  tray-macos:
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # Briefcase bundles the build host's Python, so pin it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Briefcase
        run: python -m pip install briefcase

      - name: Build the app
        run: |
          briefcase create macOS app --no-input
          briefcase build macOS app --no-input

      - name: The packaged app serves (smoke)
        env:
          INTAKE_TRAY_SMOKE: "1"
          INTAKE_DATA_DIR: ${{ runner.temp }}/intake-data
        run: |
          # macOS has no `timeout`; a stuck app must still fail the job.
          "build/intake/macos/app/benchhud intake.app/Contents/MacOS/benchhud intake" &
          pid=$!
          for _ in $(seq 120); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "smoke timed out"; exit 1; fi
          wait "$pid"

      - name: Package (ad-hoc signed)
        run: briefcase package macOS app --adhoc-sign -p zip --no-input

      - uses: actions/upload-artifact@v4
        with:
          name: benchhud-intake-macos
          path: dist/*.zip
          if-no-files-found: error

  # The tray app on Windows: build the MSI, install it on the runner, and run
  # the installed app's smoke test.
  tray-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Briefcase
        run: python -m pip install briefcase

      - name: Build the MSI
        run: |
          briefcase create  windows app --no-input
          briefcase build   windows app --no-input
          briefcase package windows app --adhoc-sign --no-input

      - uses: actions/upload-artifact@v4
        with:
          name: benchhud-intake-msi
          path: dist/*.msi
          if-no-files-found: error

      - name: msiexec install (silent)
        run: |
          $msi = (Get-ChildItem dist\*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'msi.log'
          if ($p.ExitCode -ne 0) { Get-Content msi.log -Tail 80; throw "msiexec exited with $($p.ExitCode)" }

      - name: The installed app serves (smoke)
        run: |
          $roots = @($env:ProgramFiles, "$env:LOCALAPPDATA\Programs", $env:LOCALAPPDATA)
          $exe = Get-ChildItem -Path $roots -Recurse -Filter "benchhud intake.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) { throw "benchhud intake.exe not found under: $($roots -join ', ')" }
          Write-Host "installed at: $($exe.DirectoryName)"
          $env:INTAKE_TRAY_SMOKE = "1"
          $env:INTAKE_DATA_DIR = "$env:RUNNER_TEMP\intake-data"
          $p = Start-Process $exe.FullName -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "smoke timed out" }
          if ($p.ExitCode -ne 0) { throw "smoke exited with $($p.ExitCode)" }
          Write-Host "smoke passed"

  # The headless-Linux install (#86): a .deb that runs intake as a systemd
  # service. Built in ubuntu:26.04 (the bench's release) for amd64 and the
  # Raspberry Pis' arm64. The newest tar can't stat the venv's symlinks under
  # QEMU, so the container only stages the tree and the runner packs it.
  deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Locked requirements
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -q > requirements.txt

      - name: Stage the package tree (ubuntu:26.04)
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -e DEB_ROOT=/src/build/debroot -e STAGE_ONLY=1 \
            -v "$PWD":/src -w /src ubuntu:26.04 sh packaging/deb/build.sh

      - name: Pack it
        run: |
          mkdir -p dist
          dpkg-deb --build --root-owner-group build/debroot dist/
          dpkg-deb --info dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: benchhud-intake-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  # Install it on a clean ubuntu:26.04 running systemd as PID 1 (natively on
  # amd64), and check the service the way an operator would meet it.
  deb-verify:
    needs: deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchhud-intake-deb-amd64
          path: dist

      - name: Boot ubuntu:26.04 with systemd
        run: |
          printf '%s\n' \
            'FROM ubuntu:26.04' \
            'RUN apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends systemd systemd-sysv curl dbus && rm -rf /var/lib/apt/lists/*' \
            'STOPSIGNAL SIGRTMIN+3' \
            'CMD ["/sbin/init"]' > Dockerfile.systemd
          docker build -q -t sd -f Dockerfile.systemd .
          docker run -d --name sd --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw sd
          for _ in $(seq 30); do
            state=$(docker exec sd systemctl is-system-running 2>/dev/null || true)
            case "$state" in running|degraded) break ;; esac
            sleep 1
          done
          echo "systemd: $state"

      - name: apt install the package
        run: |
          # Not /tmp: systemd mounts a tmpfs over it, hiding what docker cp puts there.
          docker exec sd mkdir -p /root/dist
          docker cp dist/. sd:/root/dist/
          docker exec sd sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /root/dist/*.deb'

      - name: It installed a disabled-until-configured service
        run: |
          docker exec sd sh -ec '
            id benchhud-intake
            test "$(stat -c %U:%a /var/lib/benchhud-intake)" = "benchhud-intake:750"
            test "$(systemctl is-enabled benchhud-intake)" = enabled
            benchhud-intake paths | grep -q "/var/lib/benchhud-intake/settings.env"
          '

      - name: With no password it refuses once and doesn't restart-loop
        run: |
          docker exec sd sh -c 'systemctl start benchhud-intake; sleep 10'
          props=$(docker exec sd systemctl show benchhud-intake -p ActiveState -p ExecMainStatus -p NRestarts)
          echo "$props"
          echo "$props" | grep -q "ExecMainStatus=2"
          echo "$props" | grep -q "NRestarts=0"
          echo "$props" | grep -q "ActiveState=failed"

      - name: With a password it serves, as its own user
        run: |
          docker exec sd sh -ec '
            printf "ci password\nci password\n" | benchhud-intake set-password
            test "$(stat -c %U:%a /var/lib/benchhud-intake/settings.env)" = "root:600"
            systemctl reset-failed benchhud-intake
            systemctl start benchhud-intake
            for _ in $(seq 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
            echo
            pid=$(systemctl show -p MainPID --value benchhud-intake)
            test "$(stat -c %U /proc/$pid)" = benchhud-intake
          ' || { docker exec sd journalctl -u benchhud-intake --no-pager | tail -30; exit 1; }
          docker exec sd systemctl status benchhud-intake --no-pager | head -12
          docker exec sd systemd-analyze security benchhud-intake --no-pager | tail -1
          # The sandbox must not quietly loosen: fail if the exposure score
          # creeps above the hardened baseline (issue #93; was 6.8 before).
          score=$(docker exec sd systemd-analyze security benchhud-intake --no-pager | tail -1 | grep -oE '[0-9]+[.][0-9]+' | head -1)
          echo "exposure score: $score (max allowed: 4.0)"
          awk -v s="$score" 'BEGIN { exit !(s <= 4.0) }'
